<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Derico | Comanda Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tap-scale:active { transform: scale(0.97); transition: transform 0.1s ease; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 pb-12 select-none">

    <!-- TELA DE LOGIN / ESCOLHA DO ACESSO -->
    <div id="modal-login" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex justify-center items-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <span class="text-2xl">🔥</span>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-amber-400 mb-1">POINT DERICO</h1>
            <p class="text-xs text-zinc-400 mb-6 font-medium uppercase tracking-wider">Selecione o operador:</p>
            
            <div class="grid grid-cols-2 gap-3 mb-2">
                <button onclick="salvarAtendente('Bianca')" class="tap-scale bg-zinc-800/80 hover:bg-amber-500/10 border border-zinc-700/60 hover:border-amber-500/50 text-zinc-200 hover:text-amber-400 font-bold py-4 px-3 rounded-2xl text-xs transition shadow-lg flex flex-col items-center justify-center gap-1">
                    <span class="text-xl">👩‍💼</span> Bianca
                </button>
                <button onclick="salvarAtendente('Letícia')" class="tap-scale bg-zinc-800/80 hover:bg-amber-500/10 border border-zinc-700/60 hover:border-amber-500/50 text-zinc-200 hover:text-amber-400 font-bold py-4 px-3 rounded-2xl text-xs transition shadow-lg flex flex-col items-center justify-center gap-1">
                    <span class="text-xl">👩‍💼</span> Letícia
                </button>
                <button onclick="salvarAtendente('Guilherme')" class="tap-scale bg-zinc-800/80 hover:bg-amber-500/10 border border-zinc-700/60 hover:border-amber-500/50 text-zinc-200 hover:text-amber-400 font-bold py-4 px-3 rounded-2xl text-xs transition shadow-lg flex flex-col items-center justify-center gap-1">
                    <span class="text-xl">👨‍💼</span> Guilherme
                </button>
                <button onclick="salvarAtendente('Balcão')" class="tap-scale bg-zinc-800/80 hover:bg-amber-500/10 border border-zinc-700/60 hover:border-amber-500/50 text-zinc-200 hover:text-amber-400 font-bold py-4 px-3 rounded-2xl text-xs transition shadow-lg flex flex-col items-center justify-center gap-1">
                    <span class="text-xl">🏪</span> Balcão
                </button>
            </div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DE COMANDA -->
    <div class="max-w-md mx-auto bg-zinc-900/90 border border-zinc-800/80 min-h-screen shadow-2xl p-4 flex flex-col justify-between rounded-b-3xl">
        <div>
            <header class="mb-3 text-center relative border-b border-zinc-800 pb-3">
                <div class="inline-block bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest mb-1">
                    Gastronomia & Sabor
                </div>
                <h1 class="text-2xl font-black tracking-tight text-amber-400">POINT DERICO</h1>
                <div class="flex justify-between items-center mt-2 px-1">
                    <p class="text-xs text-zinc-400 font-medium" id="info-mesa-atual">Painel de Lançamento</p>
                    <button onclick="trocarAtendente()" class="tap-scale text-[10px] bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3 py-1 rounded-xl font-semibold text-zinc-300 transition">
                        👤 <span id="badge-atendente">--</span>
                    </button>
                </div>
            </header>
            
            <div class="mb-3" id="bloco-selecao-mesas">
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-zinc-300 text-xs font-bold uppercase tracking-wider">Mesa / Local:</label>
                    <span class="text-[10px] text-zinc-500 font-medium">🔴 Ocupada | ⚪ Livre</span>
                </div>
                <div id="container-mesas" class="grid grid-cols-4 gap-2"></div>
            </div>

            <!-- BOTÕES DE ATALHO RÁPIDO PARA CATEGORIAS -->
            <div id="botoes-categorias-atalho" class="flex gap-1.5 overflow-x-auto pb-2 mb-1 scrollbar-none"></div>

            <!-- CARDÁPIO DINÂMICO -->
            <div class="mb-3 h-[30vh] overflow-y-auto pr-1 border border-zinc-800 rounded-2xl p-2 bg-zinc-950/60 shadow-inner" id="cardapio-dinamico-container">
                <p class="text-center text-xs text-zinc-500 mt-10 font-medium">Carregando cardápio...</p>
            </div>

            <!-- RESUMO DO PEDIDO -->
            <div class="mb-2">
                <label class="block text-zinc-300 text-xs font-bold uppercase tracking-wider mb-1">Resumo do Pedido:</label>
                <div class="bg-zinc-950/80 border border-zinc-800 rounded-2xl p-3 flex flex-col min-h-[70px] max-h-[100px] shadow-inner">
                    <div id="resumo-pedido" class="overflow-y-auto flex-grow">
                        <p class="text-zinc-600 text-center italic text-xs mt-2 font-medium" id="vazio-texto">Nenhum item adicionado.</p>
                    </div>
                    <div class="border-t border-zinc-800/80 mt-1.5 pt-1.5 flex justify-between items-center">
                        <span class="font-bold text-zinc-400 text-xs uppercase">TOTAL:</span>
                        <span id="valor-total" class="font-black text-emerald-400 text-base">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <div class="mb-2">
                <input type="text" id="obs" placeholder="Observações (Ex: Sem cebola, gelo e limão...)" class="w-full px-3 py-2.5 bg-zinc-950 border border-zinc-800 rounded-2xl focus:outline-none focus:border-amber-500 text-xs text-zinc-200 placeholder-zinc-600 shadow-inner">
            </div>
        </div>

        <div>
            <div class="flex gap-2">
                <button id="btn-enviar-pedido" onclick="enviarPedido('Pendente')" class="tap-scale flex-1 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-extrabold py-3 px-2 rounded-2xl transition shadow-lg text-xs flex items-center justify-center gap-1">
                    🚀 Enviar para Cozinha
                </button>
                <button id="btn-pix-atendente" onclick="abrirPixAtendente()" class="tap-scale flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 px-2 rounded-2xl transition shadow-lg text-xs flex items-center justify-center gap-1">
                    📱 Pagar Pix Agora
                </button>
            </div>
            <p id="status" class="text-center text-xs mt-2 text-emerald-400 font-bold h-4"></p>
        </div>
    </div>

    <!-- MODAL DE PIX -->
    <div id="modal-pix-atendente" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl relative">
            <button onclick="fecharModalPixAtendente()" class="absolute top-4 right-4 text-zinc-400 hover:text-white font-bold text-base">✕</button>
            <h3 class="text-base font-extrabold text-amber-400 mb-1" id="modal-mesa-titulo">Pix na Hora</h3>
            <p class="text-xs text-zinc-400 mb-3">Escaneie para pagar e registrar</p>
            <div class="mb-3 bg-zinc-950 py-2 rounded-2xl border border-zinc-800">
                <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-wider">Valor Total:</span>
                <p class="text-2xl font-black text-emerald-400" id="modal-valor-total">R$ 0,00</p>
            </div>
            <div class="bg-white p-3 rounded-2xl inline-block mb-3 shadow-inner">
                <img id="qrcode-img" src="" alt="QR Code Pix" class="w-40 h-40 mx-auto">
            </div>
            <p class="text-[10px] text-zinc-400 mb-4 font-mono" id="aviso-chave-pix">Chave configurada</p>
            <button onclick="confirmarPixEnivarPedido()" class="tap-scale w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 px-4 rounded-2xl text-xs transition shadow-lg">✅ Pix Pago - Enviar Pedido</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CHAVE_PIX_FIXA = "thiagoderico15@gmail.com"; 
        const NOME_PIX_FIXO = "Point Derico";

        let operadorAtual = localStorage.getItem('point_derico_operador') || "";
        let mesaSelecionada = "";
        let mesasFixas = ["Mesa 1", "Mesa 2", "Mesa 3", "Mesa 4", "Mesa 5", "Mesa 6", "Mesa 7", "Mesa 8", "Balcão"];
        let mesasExtras = JSON.parse(localStorage.getItem('point_derico_mesas_extras') || "[]");
        let mesasOcupadas = [];
        let cardapioLista = [];

        const urlParams = new URLSearchParams(window.location.search);
        let mesaUrlBruta = urlParams.get('mesa');
        let mesaUrl = "";

        if (mesaUrlBruta) {
            let limpo = decodeURIComponent(mesaUrlBruta);
            if (limpo.includes("http")) {
                let partes = limpo.split("mesa=");
                limpo = partes[partes.length - 1] || "Mesa";
            }
            mesaUrl = limpo.replace(/[\(\)\[\]]/g, '').replace(/\+/g, ' ').trim();
        }

        if (mesaUrl) {
            mesaSelecionada = mesaUrl;
            document.getElementById('bloco-selecao-mesas').style.display = 'none';
            document.getElementById('info-mesa-atual').innerText = `Autoatendimento - ${mesaUrl}`;
            
            const btnPix = document.getElementById('btn-pix-atendente');
            if (btnPix) btnPix.style.display = 'none';
            
            const btnEnviar = document.getElementById('btn-enviar-pedido');
            if (btnEnviar) btnEnviar.className = "tap-scale w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-extrabold py-3.5 px-4 rounded-2xl transition shadow-lg text-sm flex items-center justify-center gap-1";
        }

        window.verificarLogin = function() {
            if (operadorAtual || mesaUrl) {
                if(!operadorAtual && mesaUrl) operadorAtual = "Cliente (QR)";
                document.getElementById('modal-login').classList.add('hidden');
                document.getElementById('badge-atendente').innerText = operadorAtual;
            } else {
                document.getElementById('modal-login').classList.remove('hidden');
            }
        }

        window.salvarAtendente = function(nome) {
            operadorAtual = nome;
            localStorage.setItem('point_derico_operador', nome);
            verificarLogin();
        }

        window.trocarAtendente = function() {
            localStorage.removeItem('point_derico_operador');
            operadorAtual = "";
            document.getElementById('modal-login').classList.remove('hidden');
        }

        onSnapshot(collection(db, "cardapio"), (snapshot) => {
            cardapioLista = [];
            snapshot.forEach(docSnap => {
                cardapioLista.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderizarCardapio();
        });

        function obterEstiloCategoria(categoria) {
            let catLower = (categoria || "").toLowerCase();
            if (catLower.includes('hambúrguer') || catLower.includes('lanche')) return { bg: 'bg-zinc-900 border-zinc-800 text-zinc-200 hover:border-amber-500/50', badge: 'bg-amber-500 text-zinc-950 font-extrabold' };
            if (catLower.includes('porção') || catLower.includes('porcao')) return { bg: 'bg-zinc-900 border-zinc-800 text-zinc-200 hover:border-amber-500/50', badge: 'bg-amber-600 text-white font-extrabold' };
            if (catLower.includes('pastel')) return { bg: 'bg-zinc-900 border-zinc-800 text-zinc-200 hover:border-amber-500/50', badge: 'bg-amber-700 text-white font-extrabold' };
            if (catLower.includes('bebida') || catLower.includes('refri') || catLower.includes('suco') || catLower.includes('água')) return { bg: 'bg-zinc-900 border-zinc-800 text-zinc-200 hover:border-blue-500/50', badge: 'bg-blue-600 text-white font-extrabold' };
            if (catLower.includes('alcoólica') || catLower.includes('dose') || catLower.includes('drink') || catLower.includes('cerveja')) return { bg: 'bg-zinc-900 border-zinc-800 text-zinc-200 hover:border-purple-500/50', badge: 'bg-purple-600 text-white font-extrabold' };
            return { bg: 'bg-zinc-900 border-zinc-800 text-zinc-200', badge: 'bg-zinc-700 text-white font-extrabold' };
        }

        window.rolarParaCategoria = function(catId) {
            const elemento = document.getElementById('cat-' + catId);
            if (elemento) elemento.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderizarCardapio() {
            const container = document.getElementById('cardapio-dinamico-container');
            const atalhosContainer = document.getElementById('botoes-categorias-atalho');
            
            let categorias = {};
            cardapioLista.forEach(item => {
                if (item.ativo === false) return;
                let cat = item.categoria || "Geral";
                if (!categorias[cat]) categorias[cat] = [];
                categorias[cat].push(item);
            });

            atalhosContainer.innerHTML = '';
            container.innerHTML = '';

            for (let cat in categorias) {
                let catIdSafe = cat.replace(/[^a-zA-Z0-9]/g, '_');

                let btnAtalho = document.createElement('button');
                let estiloCat = obterEstiloCategoria(cat);
                btnAtalho.className = `tap-scale ${estiloCat.badge} text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-xl flex-shrink-0 shadow transition`;
                btnAtalho.innerText = cat;
                btnAtalho.onclick = () => rolarParaCategoria(catIdSafe);
                atalhosContainer.appendChild(btnAtalho);

                let tituloCat = document.createElement('h3');
                tituloCat.id = 'cat-' + catIdSafe;
                tituloCat.className = "font-extrabold text-amber-400 border-b border-zinc-800 mb-2 pb-1 mt-3 text-xs uppercase tracking-wider";
                tituloCat.innerText = cat;
                container.appendChild(tituloCat);

                let grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2 mb-3";

                categorias[cat].forEach(prod => {
                    let btn = document.createElement('button');
                    let estilo = obterEstiloCategoria(cat);
                    btn.className = `tap-scale ${estilo.bg} border p-2.5 rounded-2xl text-left flex flex-col transition shadow-sm`;
                    btn.innerHTML = `<span class="text-xs font-bold text-zinc-100">${prod.nome}</span><span class="text-[10px] text-amber-400/90 mt-1 font-extrabold">R$ ${Number(prod.preco).toFixed(2).replace('.', ',')}</span>`;
                    btn.onclick = () => adicionarItem(prod.nome, Number(prod.preco));
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            }
        }

        onSnapshot(collection(db, "pedidos"), (snapshot) => {
            mesasOcupadas = [];
            snapshot.forEach((doc) => {
                const dados = doc.data();
                if (dados.status === "Pendente" || dados.status === "Entregue") {
                    if (dados.mesa && !mesasOcupadas.includes(dados.mesa)) mesasOcupadas.push(dados.mesa);
                }
            });
            if(!mesaUrl) renderizarMesas();
        });

        window.renderizarMesas = function() {
            const container = document.getElementById('container-mesas');
            container.innerHTML = '';
            let todasAsMesas = [...mesasFixas, ...mesasExtras];

            todasAsMesas.forEach(mesa => {
                const isSelected = mesaSelecionada === mesa;
                const isOccupied = mesasOcupadas.includes(mesa);
                const isExtra = mesasExtras.includes(mesa);

                const wrapper = document.createElement('div');
                wrapper.className = "relative flex";

                const btn = document.createElement('button');
                let estilo = "tap-scale w-full font-extrabold py-2.5 px-1 rounded-2xl text-xs border transition shadow-sm ";
                if (isSelected) estilo += "bg-amber-500 text-zinc-950 border-amber-400 shadow-amber-500/20";
                else if (isOccupied) estilo += "bg-red-500/20 border-red-500/60 text-red-400";
                else estilo += "bg-zinc-900 border-zinc-800 text-zinc-300 hover:border-zinc-700";

                btn.className = estilo;
                btn.innerText = mesa + (isOccupied ? " 🔴" : "");
                btn.onclick = () => { mesaSelecionada = mesa; renderizarMesas(); };
                wrapper.appendChild(btn);

                if (isExtra && !isOccupied) {
                    const btnX = document.createElement('button');
                    btnX.innerHTML = "×";
                    btnX.className = "absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow hover:bg-red-700";
                    btnX.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`Deseja excluir a mesa extra "${mesa}"?`)) {
                            mesasExtras = mesasExtras.filter(m => m !== mesa);
                            localStorage.setItem('point_derico_mesas_extras', JSON.stringify(mesasExtras));
                            if (mesaSelecionada === mesa) mesaSelecionada = "";
                            renderizarMesas();
                        }
                    };
                    wrapper.appendChild(btnX);
                }

                container.appendChild(wrapper);
            });

            const btnAdd = document.createElement('button');
            btnAdd.className = "tap-scale bg-zinc-900 text-emerald-400 font-extrabold py-2 px-1 rounded-2xl text-xs border border-dashed border-emerald-500/50 hover:bg-emerald-500/10 transition";
            btnAdd.innerText = "+ Nova";
            btnAdd.onclick = () => {
                const novaMesa = prompt("Nome da mesa/local extra:");
                if (novaMesa && novaMesa.trim() !== '') {
                    let nomeFormatado = novaMesa.trim();
                    if (!mesasFixas.includes(nomeFormatado) && !mesasExtras.includes(nomeFormatado)) {
                        mesasExtras.push(nomeFormatado);
                        localStorage.setItem('point_derico_mesas_extras', JSON.stringify(mesasExtras));
                        mesaSelecionada = nomeFormatado;
                        renderizarMesas();
                    } else {
                        alert("Essa mesa já existe!");
                    }
                }
            };
            container.appendChild(btnAdd);
        }

        let itensCarrinho = [];

        window.adicionarItem = function(nomeItem, preco) {
            const encontrado = itensCarrinho.find(i => i.nome === nomeItem);
            if (encontrado) encontrado.qtd++;
            else itensCarrinho.push({ nome: nomeItem, preco: preco, qtd: 1 });
            atualizarResumo();
        }

        window.removerItem = function(nomeItem) {
            const index = itensCarrinho.findIndex(i => i.nome === nomeItem);
            if (index !== -1) {
                itensCarrinho[index].qtd--;
                if (itensCarrinho[index].qtd <= 0) itensCarrinho.splice(index, 1);
            }
            atualizarResumo();
        }

        function atualizarResumo() {
            const container = document.getElementById('resumo-pedido');
            const totalDisplay = document.getElementById('valor-total');
            container.innerHTML = '';
            
            if (itensCarrinho.length === 0) {
                container.innerHTML = '<p class="text-zinc-600 text-center italic text-xs mt-2 font-medium" id="vazio-texto">Nenhum item adicionado.</p>';
                totalDisplay.innerText = 'R$ 0,00';
                return;
            }

            let somaTotal = 0;
            itensCarrinho.forEach(item => {
                somaTotal += (item.preco * item.qtd);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center py-1.5 border-b border-zinc-900 last:border-0";
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-zinc-200 text-xs">${item.qtd}x ${item.nome}</span>
                        <span class="text-[10px] text-zinc-500 font-mono">R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="space-x-1 flex-shrink-0 ml-2 flex items-center">
                        <button onclick="removerItem('${item.nome}')" class="tap-scale bg-zinc-800 text-red-400 w-6 h-6 rounded-lg font-bold text-xs flex items-center justify-center">-</button>
                        <button onclick="adicionarItem('${item.nome}', ${item.preco})" class="tap-scale bg-zinc-800 text-emerald-400 w-6 h-6 rounded-lg font-bold text-xs flex items-center justify-center">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
            totalDisplay.innerText = `R$ ${somaTotal.toFixed(2).replace('.', ',')}`;
        }

        window.abrirPixAtendente = function() {
            if (!mesaSelecionada) return alert('Selecione uma Mesa!');
            if (itensCarrinho.length === 0) return alert('Adicione pelo menos um item!');

            const totalStr = document.getElementById('valor-total').innerText;
            document.getElementById('modal-mesa-titulo').innerText = `${mesaSelecionada} - Pix na Hora`;
            document.getElementById('modal-valor-total').innerText = totalStr;
            document.getElementById('aviso-chave-pix').innerText = `Chave: ${CHAVE_PIX_FIXA}`;

            let valorNum = totalStr.replace('R$', '').replace(/\s/g, '').replace('.', '').replace(',', '.');
            let payloadPix = criarPayloadPix(CHAVE_PIX_FIXA, NOME_PIX_FIXO, "SAO PAULO", (parseFloat(valorNum) || 0).toFixed(2));
            document.getElementById('qrcode-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(payloadPix)}`;
            document.getElementById('modal-pix-atendente').classList.remove('hidden');
        }

        window.fecharModalPixAtendente = function() {
            document.getElementById('modal-pix-atendente').classList.add('hidden');
        }

        window.confirmarPixEnivarPedido = function() {
            fecharModalPixAtendente();
            enviarPedido('PagoNaHora'); 
        }

        window.enviarPedido = async function(tipoEnvio) {
            const obs = document.getElementById('obs').value.trim();
            const statusTxt = document.getElementById('status');
            const total = document.getElementById('valor-total').innerText;

            if (!mesaSelecionada) return alert('Selecione uma Mesa!');
            if (itensCarrinho.length === 0) return alert('Adicione pelo menos um item!');

            let textoPedidoFormatado = itensCarrinho.map(i => `${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')})`).join('\n');
            if (obs) textoPedidoFormatado += `\nObs: ${obs}`;

            try {
                let dadosPedido = {
                    mesa: mesaSelecionada,
                    pedido: textoPedidoFormatado,
                    itensBrutos: itensCarrinho,
                    atendente: operadorAtual || "Geral", 
                    status: 'Pendente', 
                    pagoNaHora: tipoEnvio === 'PagoNaHora', 
                    total: total,
                    dataCriacao: new Date().toISOString().split('T')[0],
                    timestampCriacao: Date.now(),
                    horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit', second:'2-digit'})
                };

                await addDoc(collection(db, "pedidos"), dadosPedido);

                if(!mesaUrl) { mesaSelecionada = ""; renderizarMesas(); }
                document.getElementById('obs').value = '';
                itensCarrinho = []; atualizarResumo();
                
                statusTxt.innerText = "🚀 Pedido enviado com sucesso!";
                setTimeout(() => statusTxt.innerText = "", 3000);
            } catch (e) { alert("Erro ao enviar pedido."); }
        }

        function criarPayloadPix(pixKey, name, city, amount) {
            function format(id, val) { return id + String(val.length).padStart(2, '0') + val; }
            let merchantAccount = format("00", "br.gov.bcb.pix") + format("01", pixKey);
            let payload = format("00", "01") + format("26", merchantAccount) + format("52", "0000") + format("53", "986") + (amount > 0 ? format("54", amount) : "") + format("58", "BR") + format("59", name.substring(0, 25).normalize("NFD").replace(/[\u0300-\u036f]/g, "")) + format("60", city.substring(0, 15).normalize("NFD").replace(/[\u0300-\u036f]/g, "")) + format("62", format("05", "POINTDERICO")) + "6304";
            let polinomio = 0x1021, resultado = 0xFFFF;
            for (let c = 0; c < payload.length; c++) {
                resultado ^= (payload.charCodeAt(c) << 8);
                for (let i = 0; i < 8; i++) {
                    if ((resultado & 0x8000) !== 0) resultado = ((resultado << 1) ^ polinomio);
                    else resultado = (resultado << 1);
                }
            }
            return payload + (resultado & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        verificarLogin();
        if(!mesaUrl) renderizarMesas();
    </script>
