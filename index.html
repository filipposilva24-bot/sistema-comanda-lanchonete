<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda - Point Derico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-12">

    <!-- TELA DE LOGIN / ESCOLHA DO ACESSO -->
    <div id="modal-login" class="fixed inset-0 bg-black/90 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <h1 class="text-2xl font-bold text-yellow-500 bg-black py-2 rounded-xl mb-2">POINT DERICO</h1>
            <p class="text-xs text-gray-500 mb-4 font-semibold uppercase tracking-wider">Selecione quem está operando:</p>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="salvarAtendente('Bianca')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-3 rounded-xl text-sm transition shadow-md flex flex-col items-center justify-center">
                    <span class="text-lg mb-0.5">👩‍💼</span> Bianca
                </button>
                <button onclick="salvarAtendente('Letícia')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-3 rounded-xl text-sm transition shadow-md flex flex-col items-center justify-center">
                    <span class="text-lg mb-0.5">👩‍💼</span> Letícia
                </button>
                <button onclick="salvarAtendente('Guilherme')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-3 rounded-xl text-sm transition shadow-md flex flex-col items-center justify-center">
                    <span class="text-lg mb-0.5">👨‍💼</span> Guilherme
                </button>
                <button onclick="salvarAtendente('Balcão')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-3 rounded-xl text-sm transition shadow-md flex flex-col items-center justify-center">
                    <span class="text-lg mb-0.5">🏪</span> Balcão
                </button>
            </div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DE COMANDA -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg p-4 flex flex-col justify-between">
        <div>
            <header class="mb-3 text-center relative">
                <h1 class="text-3xl font-bold text-yellow-500 bg-black py-2 rounded-xl">POINT DERICO</h1>
                <div class="flex justify-between items-center mt-2 px-1">
                    <p class="text-xs text-gray-500" id="info-mesa-atual">Lançamento de Comanda</p>
                    <button onclick="trocarAtendente()" class="text-[11px] bg-gray-200 hover:bg-gray-300 px-2.5 py-1 rounded-lg font-semibold text-gray-700 transition" id="badge-atendente">
                        👤 Operador: --
                    </button>
                </div>
            </header>
            
            <div class="mb-3" id="bloco-selecao-mesas">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-gray-700 text-xs font-bold">Selecione a Mesa / Local:</label>
                    <span class="text-[10px] text-gray-400 font-semibold">🔴 Ocupada | ⚪ Livre</span>
                </div>
                <div id="container-mesas" class="grid grid-cols-4 gap-2"></div>
            </div>

            <!-- BOTÕES DE ATALHO RÁPIDO PARA CATEGORIAS DO CARDÁPIO -->
            <div id="botoes-categorias-atalho" class="flex gap-1 overflow-x-auto pb-2 mb-1 scrollbar-none"></div>

            <!-- Área de Cardápio Dinâmico com Cores por Grupo -->
            <div class="mb-3 h-[32vh] overflow-y-auto pr-1 border rounded-xl p-2 bg-gray-50" id="cardapio-dinamico-container">
                <p class="text-center text-xs text-gray-400 mt-10">Carregando cardápio...</p>
            </div>

            <div class="mb-2">
                <label class="block text-gray-700 text-xs font-bold mb-1">Resumo do Pedido:</label>
                <div class="bg-white border-2 border-gray-200 rounded-xl p-2 flex flex-col min-h-[70px] max-h-[100px]">
                    <div id="resumo-pedido" class="overflow-y-auto flex-grow">
                        <p class="text-gray-400 text-center italic text-xs mt-2" id="vazio-texto">Nenhum item adicionado.</p>
                    </div>
                    <div class="border-t border-gray-200 mt-1 pt-1 flex justify-between items-center">
                        <span class="font-bold text-gray-700 text-xs">TOTAL:</span>
                        <span id="valor-total" class="font-bold text-green-600 text-base">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <div class="mb-2">
                <input type="text" id="obs" placeholder="Observações (Ex: Sem cebola, Copo com gelo...)" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-500 text-xs bg-gray-50">
            </div>
        </div>

        <div class="flex gap-2">
            <button onclick="enviarPedido('Pendente')" class="flex-1 bg-black text-yellow-500 font-bold py-2.5 px-2 rounded-xl hover:bg-gray-800 transition shadow-lg text-xs border-2 border-yellow-500">
                🚀 Enviar (Paga Depois)
            </button>
            <button onclick="abrirPixAtendente()" class="flex-1 bg-green-600 text-white font-bold py-2.5 px-2 rounded-xl hover:bg-green-500 transition shadow-lg text-sm">
                📱 Pagar Pix Agora
            </button>
        </div>
        <p id="status" class="text-center text-xs mt-1 text-green-600 font-semibold h-4"></p>
    </div>

    <!-- MODAL DE PIX NO ATENDENTE -->
    <div id="modal-pix-atendente" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
            <button onclick="fecharModalPixAtendente()" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-lg">✕</button>
            <h3 class="text-lg font-bold text-yellow-500 mb-1" id="modal-mesa-titulo">Pix na Hora</h3>
            <p class="text-xs text-gray-400 mb-3">Escaneie para pagar e enviar o pedido</p>
            <div class="mb-3">
                <span class="text-xs text-gray-400 uppercase font-bold">Valor Total:</span>
                <p class="text-2xl font-bold text-green-400" id="modal-valor-total">R$ 0,00</p>
            </div>
            <div class="bg-white p-3 rounded-xl inline-block mb-2 shadow-inner">
                <img id="qrcode-img" src="" alt="QR Code Pix" class="w-40 h-40 mx-auto">
            </div>
            <p class="text-[10px] text-gray-400 mb-4" id="aviso-chave-pix">Chave configurada</p>
            <button onclick="confirmarPixEnivarPedido()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg">✅ Pix Pago - Enviar para Cozinha</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CHAVE_PIX_FIXA = "thiagoderico15@gmail.com"; 
        const NOME_PIX_FIXO = "Point Derico";

        let operadorAtual = localStorage.getItem('point_derico_operador') || "";
        let mesaSelecionada = "";
        let mesasFixas = ["Mesa 1", "Mesa 2", "Mesa 3", "Mesa 4", "Mesa 5", "Mesa 6", "Mesa 7", "Mesa 8", "Balcão"];
        let mesasExtras = JSON.parse(localStorage.getItem('point_derico_mesas_extras') || "[]");
        let mesasOcupadas = [];
        let cardapioLista = [];

        // Tratamento rigoroso para pegar APENAS o nome da mesa e limpar qualquer URL ou sujeira colada
        const urlParams = new URLSearchParams(window.location.search);
        let mesaUrlBruta = urlParams.get('mesa');
        let mesaUrl = "";

        if (mesaUrlBruta) {
            // Se por acaso vier com link colado dentro, limpa e extrai só o nome da mesa
            let limpo = decodeURIComponent(mesaUrlBruta);
            if (limpo.includes("http")) {
                let partes = limpo.split("mesa=");
                limpo = partes[partes.length - 1] || "Mesa";
            }
            mesaUrl = limpo.replace(/\+/g, ' ').trim();
        }

        if (mesaUrl) {
            mesaSelecionada = mesaUrl;
            document.getElementById('bloco-selecao-mesas').style.display = 'none';
            document.getElementById('info-mesa-atual').innerText = `Autoatendimento - ${mesaUrl}`;
        }

        window.verificarLogin = function() {
            if (operadorAtual || mesaUrl) {
                if(!operadorAtual && mesaUrl) operadorAtual = "Cliente (QR Code)";
                document.getElementById('modal-login').classList.add('hidden');
                document.getElementById('badge-atendente').innerText = `👤 Operador: ${operadorAtual}`;
            } else {
                document.getElementById('modal-login').classList.remove('hidden');
            }
        }

        window.salvarAtendente = function(nome) {
            operadorAtual = nome;
            localStorage.setItem('point_derico_operador', nome);
            verificarLogin();
        }

        window.trocarAtendente = function() {
            localStorage.removeItem('point_derico_operador');
            operadorAtual = "";
            document.getElementById('modal-login').classList.remove('hidden');
        }

        onSnapshot(collection(db, "cardapio"), (snapshot) => {
            cardapioLista = [];
            snapshot.forEach(docSnap => {
                cardapioLista.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderizarCardapio();
        });

        function obterEstiloCategoria(categoria) {
            let catLower = (categoria || "").toLowerCase();
            if (catLower.includes('hambúrguer') || catLower.includes('lanche')) return { bg: 'bg-orange-50 border-orange-200 text-orange-900', badge: 'bg-orange-500 text-white' };
            if (catLower.includes('porção') || catLower.includes('porcao')) return { bg: 'bg-yellow-50 border-yellow-200 text-yellow-900', badge: 'bg-yellow-500 text-white' };
            if (catLower.includes('pastel')) return { bg: 'bg-amber-50 border-amber-200 text-amber-900', badge: 'bg-amber-600 text-white' };
            if (catLower.includes('bebida') || catLower.includes('refri') || catLower.includes('suco') || catLower.includes('água')) return { bg: 'bg-blue-50 border-blue-200 text-blue-900', badge: 'bg-blue-500 text-white' };
            if (catLower.includes('alcoólica') || catLower.includes('dose') || catLower.includes('drink') || catLower.includes('cerveja')) return { bg: 'bg-purple-50 border-purple-200 text-purple-900', badge: 'bg-purple-500 text-white' };
            return { bg: 'bg-gray-50 border-gray-200 text-gray-900', badge: 'bg-gray-500 text-white' };
        }

        window.rolarParaCategoria = function(catId) {
            const elemento = document.getElementById('cat-' + catId);
            if (elemento) elemento.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderizarCardapio() {
            const container = document.getElementById('cardapio-dinamico-container');
            const atalhosContainer = document.getElementById('botoes-categorias-atalho');
            
            let categorias = {};
            cardapioLista.forEach(item => {
                if (item.ativo === false) return;
                let cat = item.categoria || "Geral";
                if (!categorias[cat]) categorias[cat] = [];
                categorias[cat].push(item);
            });

            atalhosContainer.innerHTML = '';
            container.innerHTML = '';

            for (let cat in categorias) {
                let catIdSafe = cat.replace(/[^a-zA-Z0-9]/g, '_');

                let btnAtalho = document.createElement('button');
                let estiloCat = obterEstiloCategoria(cat);
                btnAtalho.className = `${estiloCat.badge} text-[11px] font-bold px-3 py-1 rounded-lg flex-shrink-0 shadow-sm transition hover:opacity-80`;
                btnAtalho.innerText = cat;
                btnAtalho.onclick = () => rolarParaCategoria(catIdSafe);
                atalhosContainer.appendChild(btnAtalho);

                let tituloCat = document.createElement('h3');
                tituloCat.id = 'cat-' + catIdSafe;
                tituloCat.className = "font-bold text-gray-800 border-b border-gray-300 mb-2 pb-1 mt-2 text-xs uppercase tracking-wider";
                tituloCat.innerText = cat;
                container.appendChild(tituloCat);

                let grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2 mb-3";

                categorias[cat].forEach(prod => {
                    let btn = document.createElement('button');
                    let estilo = obterEstiloCategoria(cat);
                    btn.className = `${estilo.bg} border p-2 rounded-lg text-left flex flex-col transition hover:shadow-sm`;
                    btn.innerHTML = `<span class="text-xs font-bold">${prod.nome}</span><span class="text-[10px] opacity-75 mt-1 font-semibold">R$ ${Number(prod.preco).toFixed(2).replace('.', ',')}</span>`;
                    btn.onclick = () => adicionarItem(prod.nome, Number(prod.preco));
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            }
        }

        onSnapshot(collection(db, "pedidos"), (snapshot) => {
            mesasOcupadas = [];
            snapshot.forEach((doc) => {
                const dados = doc.data();
                if (dados.status === "Pendente" || dados.status === "Entregue") {
                    if (dados.mesa && !mesasOcupadas.includes(dados.mesa)) mesasOcupadas.push(dados.mesa);
                }
            });
            if(!mesaUrl) renderizarMesas();
        });

        window.renderizarMesas = function() {
            const container = document.getElementById('container-mesas');
            container.innerHTML = '';
            let todasAsMesas = [...mesasFixas, ...mesasExtras];

            todasAsMesas.forEach(mesa => {
                const isSelected = mesaSelecionada === mesa;
                const isOccupied = mesasOcupadas.includes(mesa);
                const isExtra = mesasExtras.includes(mesa);

                const wrapper = document.createElement('div');
                wrapper.className = "relative flex";

                const btn = document.createElement('button');
                let estilo = "w-full font-bold py-2 px-1 rounded-lg text-xs border-2 transition shadow-sm ";
                if (isSelected) estilo += "bg-black text-yellow-500 border-yellow-500 ring-2 ring-yellow-400";
                else if (isOccupied) estilo += "bg-red-600 text-white border-red-700";
                else estilo += "bg-gray-200 text-gray-700 border-transparent hover:bg-gray-300";

                btn.className = estilo;
                btn.innerText = mesa + (isOccupied ? " 🔴" : "");
                btn.onclick = () => { mesaSelecionada = mesa; renderizarMesas(); };
                wrapper.appendChild(btn);

                if (isExtra && !isOccupied) {
                    const btnX = document.createElement('button');
                    btnX.innerHTML = "×";
                    btnX.className = "absolute -top-1 -right-1 bg-red-700 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow hover:bg-red-900";
                    btnX.title = "Excluir mesa extra";
                    btnX.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`Deseja excluir a mesa extra "${mesa}"?`)) {
                            mesasExtras = mesasExtras.filter(m => m !== mesa);
                            localStorage.setItem('point_derico_mesas_extras', JSON.stringify(mesasExtras));
                            if (mesaSelecionada === mesa) mesaSelecionada = "";
                            renderizarMesas();
                        }
                    };
                    wrapper.appendChild(btnX);
                }

                container.appendChild(wrapper);
            });

            const btnAdd = document.createElement('button');
            btnAdd.className = "bg-green-100 text-green-700 font-bold py-2 px-1 rounded-lg text-xs border-2 border-green-400 border-dashed hover:bg-green-200 transition";
            btnAdd.innerText = "+ Nova";
            btnAdd.onclick = () => {
                const novaMesa = prompt("Nome da mesa/local extra:");
                if (novaMesa && novaMesa.trim() !== '') {
                    let nomeFormatado = novaMesa.trim();
                    if (!mesasFixas.includes(nomeFormatado) && !mesasExtras.includes(nomeFormatado)) {
                        mesasExtras.push(nomeFormatado);
                        localStorage.setItem('point_derico_mesas_extras', JSON.stringify(mesasExtras));
                        mesaSelecionada = nomeFormatado;
                        renderizarMesas();
                    } else {
                        alert("Essa mesa já existe!");
                    }
                }
            };
            container.appendChild(btnAdd);
        }

        let itensCarrinho = [];

        window.adicionarItem = function(nomeItem, preco) {
            const encontrado = itensCarrinho.find(i => i.nome === nomeItem);
            if (encontrado) encontrado.qtd++;
            else itensCarrinho.push({ nome: nomeItem, preco: preco, qtd: 1 });
            atualizarResumo();
        }

        window.removerItem = function(nomeItem) {
            const index = itensCarrinho.findIndex(i => i.nome === nomeItem);
            if (index !== -1) {
                itensCarrinho[index].qtd--;
                if (itensCarrinho[index].qtd <= 0) itensCarrinho.splice(index, 1);
            }
            atualizarResumo();
        }

        function atualizarResumo() {
            const container = document.getElementById('resumo-pedido');
            const totalDisplay = document.getElementById('valor-total');
            container.innerHTML = '';
            
            if (itensCarrinho.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center italic text-xs mt-2" id="vazio-texto">Nenhum item adicionado.</p>';
                totalDisplay.innerText = 'R$ 0,00';
                return;
            }

            let somaTotal = 0;
            itensCarrinho.forEach(item => {
                somaTotal += (item.preco * item.qtd);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center py-1 border-b border-gray-100 last:border-0";
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-800 text-xs">${item.qtd}x ${item.nome}</span>
                        <span class="text-[10px] text-gray-500">R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="space-x-1 flex-shrink-0 ml-2">
                        <button onclick="removerItem('${item.nome}')" class="bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold text-xs">-</button>
                        <button onclick="adicionarItem('${item.nome}', ${item.preco})" class="bg-green-100 text-green-600 px-2 py-0.5 rounded font-bold text-xs">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
            totalDisplay.innerText = `R$ ${somaTotal.toFixed(2).replace('.', ',')}`;
        }

        window.abrirPixAtendente = function() {
            if (!mesaSelecionada) return alert('Selecione uma Mesa!');
            if (itensCarrinho.length === 0) return alert('Adicione pelo menos um item!');

            const totalStr = document.getElementById('valor-total').innerText;
            document.getElementById('modal-mesa-titulo').innerText = `${mesaSelecionada} - Pix na Hora`;
            document.getElementById('modal-valor-total').innerText = totalStr;
            document.getElementById('aviso-chave-pix').innerText = `Chave: ${CHAVE_PIX_FIXA}`;

            let valorNum = totalStr.replace('R$', '').replace(/\s/g, '').replace('.', '').replace(',', '.');
            let payloadPix = criarPayloadPix(CHAVE_PIX_FIXA, NOME_PIX_FIXO, "SAO PAULO", (parseFloat(valorNum) || 0).toFixed(2));
            document.getElementById('qrcode-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(payloadPix)}`;
            document.getElementById('modal-pix-atendente').classList.remove('hidden');
        }

        window.fecharModalPixAtendente = function() {
            document.getElementById('modal-pix-atendente').classList.add('hidden');
        }

        window.confirmarPixEnivarPedido = function() {
            fecharModalPixAtendente();
            enviarPedido('PagoNaHora'); 
        }

        window.enviarPedido = async function(tipoEnvio) {
            const obs = document.getElementById('obs').value.trim();
            const statusTxt = document.getElementById('status');
            const total = document.getElementById('valor-total').innerText;

            if (!mesaSelecionada) return alert('Selecione uma Mesa!');
            if (itensCarrinho.length === 0) return alert('Adicione pelo menos um item!');

            let textoPedidoFormatado = itensCarrinho.map(i => `${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')})`).join('\n');
            if (obs) textoPedidoFormatado += `\nObs: ${obs}`;

            try {
                let dadosPedido = {
                    mesa: mesaSelecionada,
                    pedido: textoPedidoFormatado,
                    itensBrutos: itensCarrinho,
                    atendente: operadorAtual || "Geral", 
                    status: 'Pendente', 
                    pagoNaHora: tipoEnvio === 'PagoNaHora', 
                    total: total,
                    dataCriacao: new Date().toISOString().split('T')[0],
                    timestampCriacao: Date.now(),
                    horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit', second:'2-digit'})
                };

                await addDoc(collection(db, "pedidos"), dadosPedido);

                if(!mesaUrl) { mesaSelecionada = ""; renderizarMesas(); }
                document.getElementById('obs').value = '';
                itensCarrinho = []; atualizarResumo();
                
                statusTxt.innerText = tipoEnvio === 'PagoNaHora' ? "Pix confirmado! Pedido na Cozinha." : "Pedido enviado para cozinha!";
                setTimeout(() => statusTxt.innerText = "", 3000);
            } catch (e) { alert("Erro ao enviar pedido."); }
        }

        function criarPayloadPix(pixKey, name, city, amount) {
            function format(id, val) { return id + String(val.length).padStart(2, '0') + val; }
            let merchantAccount = format("00", "br.gov.bcb.pix") + format("01", pixKey);
            let payload = format("00", "01") + format("26", merchantAccount) + format("52", "0000") + format("53", "986") + (amount > 0 ? format("54", amount) : "") + format("58", "BR") + format("59", name.substring(0, 25).normalize("NFD").replace(/[\u0300-\u036f]/g, "")) + format("60", city.substring(0, 15).normalize("NFD").replace(/[\u0300-\u036f]/g, "")) + format("62", format("05", "POINTDERICO")) + "6304";
            let polinomio = 0x1021, resultado = 0xFFFF;
            for (let c = 0; c < payload.length; c++) {
                resultado ^= (payload.charCodeAt(c) << 8);
                for (let i = 0; i < 8; i++) {
                    if ((resultado & 0x8000) !== 0) resultado = ((resultado << 1) ^ polinomio);
                    else resultado = (resultado << 1);
                }
            }
            return payload + (resultado & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        verificarLogin();
        if(!mesaUrl) renderizarMesas();
    </script>
</body>
</html>
