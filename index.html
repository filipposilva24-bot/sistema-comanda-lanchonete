    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let mesaSelecionada = "";
        let mesasDisponiveis = ["Mesa 1", "Mesa 2", "Mesa 3", "Mesa 4", "Mesa 5", "Mesa 6", "Mesa 7", "Mesa 8", "Balcão"];
        let mesasOcupadas = [];

        // Monitora o banco para saber quais mesas estão ocupadas em tempo real
        onSnapshot(collection(db, "pedidos"), (snapshot) => {
            mesasOcupadas = [];
            snapshot.forEach((doc) => {
                const dados = doc.data();
                if (dados.status === "Pendente" || dados.status === "Entregue") {
                    if (!mesasOcupadas.includes(dados.mesa)) {
                        mesasOcupadas.push(dados.mesa);
                    }
                }
            });
            renderizarMesas();
        });

        window.renderizarMesas = function() {
            const container = document.getElementById('container-mesas');
            container.innerHTML = '';
            mesasDisponiveis.forEach(mesa => {
                const btn = document.createElement('button');
                const isSelected = mesaSelecionada === mesa;
                const isOccupied = mesasOcupadas.includes(mesa);

                let estilo = "font-bold py-2 px-1 rounded-lg text-xs border-2 transition shadow-sm ";
                if (isSelected) {
                    estilo += "bg-black text-yellow-500 border-yellow-500 ring-2 ring-yellow-400";
                } else if (isOccupied) {
                    estilo += "bg-red-600 text-white border-red-700 animate-pulse"; // Fica vermelha se ocupada
                } else {
                    estilo += "bg-gray-200 text-gray-700 border-transparent hover:bg-gray-300";
                }

                btn.className = estilo;
                btn.innerText = mesa + (isOccupied ? " 🔴" : "");
                btn.onclick = () => { mesaSelecionada = mesa; renderizarMesas(); };
                container.appendChild(btn);
            });

            const btnAdd = document.createElement('button');
            btnAdd.className = "bg-green-100 text-green-700 font-bold py-2 px-1 rounded-lg text-xs border-2 border-green-400 border-dashed hover:bg-green-200 transition";
            btnAdd.innerText = "+ Nova";
            btnAdd.onclick = () => {
                const novaMesa = prompt("Nome da mesa/local (Ex: Retirada):");
                if (novaMesa && novaMesa.trim() !== '') {
                    mesasDisponiveis.push(novaMesa.trim());
                    mesaSelecionada = novaMesa.trim();
                    renderizarMesas();
                }
            };
            container.appendChild(btnAdd);
        }

        let itensCarrinho = [];

        window.adicionarItem = function(nomeItem, preco) {
            const encontrado = itensCarrinho.find(i => i.nome === nomeItem);
            if (encontrado) { encontrado.qtd++; } else { itensCarrinho.push({ nome: nomeItem, preco: preco, qtd: 1 }); }
            atualizarResumo();
        }

        window.removerItem = function(nomeItem) {
            const index = itensCarrinho.findIndex(i => i.nome === nomeItem);
            if (index !== -1) {
                itensCarrinho[index].qtd--;
                if (itensCarrinho[index].qtd <= 0) itensCarrinho.splice(index, 1);
            }
            atualizarResumo();
        }

        function atualizarResumo() {
            const container = document.getElementById('resumo-pedido');
            const totalDisplay = document.getElementById('valor-total');
            container.innerHTML = '';
            
            if (itensCarrinho.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center italic text-sm mt-2" id="vazio-texto">Nenhum item adicionado.</p>';
                totalDisplay.innerText = 'R$ 0,00';
                return;
            }

            let somaTotal = 0;
            itensCarrinho.forEach(item => {
                somaTotal += (item.preco * item.qtd);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center py-1 border-b border-gray-100 last:border-0";
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-800 text-sm">${item.qtd}x ${item.nome}</span>
                        <span class="text-[10px] text-gray-500">R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="space-x-1 flex-shrink-0 ml-2">
                        <button onclick="removerItem('${item.nome}')" class="bg-red-100 text-red-600 px-3 py-1 rounded-lg font-bold text-sm shadow-sm">-</button>
                        <button onclick="adicionarItem('${item.nome}', ${item.preco})" class="bg-green-100 text-green-600 px-3 py-1 rounded-lg font-bold text-sm shadow-sm">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
            totalDisplay.innerText = `R$ ${somaTotal.toFixed(2).replace('.', ',')}`;
        }

        window.enviarPedido = async function() {
            const obs = document.getElementById('obs').value.trim();
            const status = document.getElementById('status');
            const total = document.getElementById('valor-total').innerText;

            if (!mesaSelecionada) return alert('Selecione uma Mesa!');
            if (itensCarrinho.length === 0) return alert('Adicione pelo menos um item!');

            let textoPedidoFormatado = itensCarrinho.map(i => `${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')})`).join('\n');
            if (obs) textoPedidoFormatado += `\nObs: ${obs}`;

            try {
                await addDoc(collection(db, "pedidos"), {
                    mesa: mesaSelecionada,
                    pedido: textoPedidoFormatado,
                    status: "Pendente",
                    total: total,
                    dataCriacao: new Date().toISOString().split('T')[0],
                    horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                });

                mesaSelecionada = ""; renderizarMesas();
                document.getElementById('obs').value = '';
                itensCarrinho = []; atualizarResumo();
                status.innerText = "Pedido enviado!"; setTimeout(() => status.innerText = "", 3000);
            } catch (e) {
                alert("Erro ao enviar pedido.");
            }
        }
        renderizarMesas();
