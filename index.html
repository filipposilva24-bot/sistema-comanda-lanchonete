<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Point Derico | Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tap-scale:active { transform: scale(0.96); transition: transform 0.1s; }
        /* Esconde barra de rolagem mas permite o swipe */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Suavidade no deslize do Swipe to Delete */
        .swipe-item-container { scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .swipe-snap-center { scroll-snap-align: center; }
    </style>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <!-- HEADER / TOPO INTEILGENTE -->
    <header class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 p-3 flex justify-between items-center z-40 shadow-sm shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-amber-500 text-xl">🔥</span>
            <div>
                <h1 class="text-sm font-black tracking-tight text-amber-600 dark:text-amber-400 leading-tight">POINT DERICO</h1>
                <div class="flex items-center gap-1 mt-0.5">
                    <!-- 9. Indicador de Conexão -->
                    <span id="status-conexao" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <p class="text-[10px] text-zinc-500 dark:text-zinc-400 font-bold uppercase" id="texto-conexao">Online</p>
                </div>
            </div>
        </div>
        <div class="text-right">
            <!-- 39. Previsão de Tempo -->
            <p class="text-[10px] text-zinc-500 dark:text-zinc-400 font-bold uppercase">Tempo Cozinha</p>
            <p class="text-xs font-black text-amber-600 dark:text-amber-400" id="tempo-medio">-- min</p>
        </div>
    </header>

    <!-- NAVEGAÇÃO EM ABAS -->
    <div class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 p-2 flex gap-2 shrink-0">
        <button onclick="mudarAba('mesas')" id="aba-mesas" class="tap-scale flex-1 bg-amber-500 text-zinc-950 font-extrabold py-2.5 rounded-xl text-xs shadow transition">🏠 Salão</button>
        <button onclick="mudarAba('cardapio')" id="aba-cardapio" class="tap-scale flex-1 bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 font-extrabold py-2.5 rounded-xl text-xs transition">🍔 Cardápio</button>
    </div>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-grow overflow-y-auto relative scrollbar-hide pb-24">
        
        <!-- VISÃO MESAS (23. Mapa Visual do Salão) -->
        <div id="view-mesas" class="p-4 grid grid-cols-3 gap-3">
            <!-- Gerado via JS -->
        </div>

        <!-- VISÃO CARDÁPIO -->
        <div id="view-cardapio" class="p-4 hidden">
            <div class="mb-4 bg-zinc-200/50 dark:bg-zinc-800/50 rounded-2xl p-3 flex justify-between items-center shadow-inner">
                <span class="text-xs font-bold text-zinc-500 dark:text-zinc-400 uppercase">Atendendo:</span>
                <span class="text-sm font-black text-amber-600 dark:text-amber-400 bg-white dark:bg-zinc-900 px-3 py-1 rounded-xl shadow-sm" id="mesa-atual-badge">Nenhuma</span>
            </div>
            <div id="lista-cardapio" class="space-y-3">
                <!-- Gerado via JS -->
            </div>
        </div>
    </main>

    <!-- 16. CARRINHO FLUTUANTE -->
    <button id="btn-carrinho-flutuante" onclick="abrirCarrinho()" class="fixed bottom-6 right-6 left-6 tap-scale bg-amber-500 text-zinc-950 font-black p-4 rounded-2xl shadow-[0_10px_25px_-5px_rgba(245,158,11,0.5)] flex justify-between items-center z-40 hidden transition-transform">
        <div class="flex items-center gap-2">
            <span class="text-xl">🛒</span>
            <span id="carrinho-badge" class="bg-zinc-950 text-amber-500 text-[10px] px-2 py-1 rounded-full">0 itens</span>
        </div>
        <span id="carrinho-total-flutuante" class="text-lg">R$ 0,00</span>
    </button>

    <!-- MODAL CARRINHO & RESUMO -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col justify-end hidden transition-opacity">
        <div class="bg-white dark:bg-zinc-900 rounded-t-3xl w-full max-h-[90vh] flex flex-col shadow-2xl relative">
            <div class="p-4 border-b border-zinc-200 dark:border-zinc-800 flex justify-between items-center shrink-0">
                <h3 class="font-black text-amber-600 dark:text-amber-400">Resumo do Pedido</h3>
                <button onclick="fecharCarrinho()" class="text-zinc-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-grow bg-zinc-50 dark:bg-zinc-950" id="lista-carrinho">
                <!-- 17. Itens com Swipe to Delete injetados via JS -->
            </div>

            <div class="p-4 bg-white dark:bg-zinc-900 border-t border-zinc-200 dark:border-zinc-800 shrink-0">
                <textarea id="obs-pedido" placeholder="Ex: Sem cebola, carne bem passada..." class="w-full bg-zinc-100 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 text-xs text-zinc-800 dark:text-zinc-200 outline-none focus:border-amber-500 mb-3 resize-none h-16"></textarea>
                
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs text-zinc-500 font-bold uppercase">Total:</span>
                    <span class="text-2xl font-black text-emerald-500" id="carrinho-total-final">R$ 0,00</span>
                </div>

                <div class="flex gap-2 mb-3">
                    <!-- 8. Calculadora de Racha -->
                    <button onclick="abrirRacha()" class="tap-scale flex-1 bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 font-extrabold py-3 rounded-xl text-xs flex justify-center items-center gap-1 shadow-sm">
                        ➗ Rachar Conta
                    </button>
                    <!-- Limpar Carrinho -->
                    <button onclick="limparCarrinho()" class="tap-scale bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 px-4 py-3 rounded-xl text-xs font-black shadow-sm">🗑️ Limpar</button>
                </div>

                <button onclick="enviarPedido()" class="tap-scale w-full bg-emerald-600 text-white font-black py-4 rounded-2xl text-sm shadow-[0_8px_20px_-5px_rgba(16,185,129,0.5)] flex justify-center items-center gap-2">
                    ✅ Enviar para Cozinha
                </button>
            </div>
        </div>
    </div>

    <!-- 31. MODAL TECLADO GIGANTE (NUMPAD) -->
    <div id="modal-numpad" class="fixed inset-0 bg-black/95 z-[60] flex flex-col justify-center items-center hidden">
        <div class="w-full max-w-xs p-6">
            <p class="text-amber-500 text-center font-bold text-xs uppercase tracking-widest mb-2">Quantidade</p>
            <div id="numpad-display" class="bg-zinc-900 border border-zinc-700 rounded-2xl p-4 text-center text-4xl font-black text-white mb-6 min-h-[72px]">1</div>
            
            <div class="grid grid-cols-3 gap-3">
                <button onclick="numPress(1)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">1</button>
                <button onclick="numPress(2)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">2</button>
                <button onclick="numPress(3)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">3</button>
                <button onclick="numPress(4)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">4</button>
                <button onclick="numPress(5)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">5</button>
                <button onclick="numPress(6)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">6</button>
                <button onclick="numPress(7)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">7</button>
                <button onclick="numPress(8)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">8</button>
                <button onclick="numPress(9)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">9</button>
                <button onclick="fecharNumpad()" class="tap-scale bg-red-600 text-white text-sm font-black py-4 rounded-2xl">✕ CANCEL</button>
                <button onclick="numPress(0)" class="tap-scale bg-zinc-800 text-white text-2xl font-bold py-4 rounded-2xl">0</button>
                <button onclick="confirmarNumpad()" class="tap-scale bg-emerald-600 text-white text-sm font-black py-4 rounded-2xl">✅ OK</button>
            </div>
        </div>
    </div>

    <!-- MODAL INFORMAÇÃO DA MESA (34. Pagamento Parcial) -->
    <div id="modal-mesa-info" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
            <button onclick="fecharMesaInfo()" class="absolute top-4 right-4 text-zinc-400 hover:text-white font-bold">✕</button>
            <h3 class="text-lg font-black text-amber-500 mb-1" id="info-mesa-titulo">Mesa</h3>
            <p class="text-[10px] text-zinc-500 uppercase font-bold mb-4" id="info-mesa-status">Status</p>
            
            <div class="bg-zinc-50 dark:bg-zinc-950 p-3 rounded-2xl border border-zinc-200 dark:border-zinc-800 mb-4 h-32 overflow-y-auto text-xs text-zinc-700 dark:text-zinc-300 font-mono shadow-inner" id="info-mesa-extrato"></div>
            
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-zinc-500 font-bold">Total Original:</span>
                <span class="text-sm font-bold text-zinc-800 dark:text-zinc-200" id="info-mesa-total-orig">R$ 0,00</span>
            </div>
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs text-emerald-600 font-bold">Já Pago:</span>
                <span class="text-sm font-bold text-emerald-500" id="info-mesa-ja-pago">- R$ 0,00</span>
            </div>
            <div class="flex justify-between items-center mb-4 bg-amber-50 dark:bg-amber-950/30 p-2 rounded-xl border border-amber-200 dark:border-amber-900/30">
                <span class="text-xs font-black text-amber-700 dark:text-amber-500">Restante a Pagar:</span>
                <span class="text-xl font-black text-amber-600 dark:text-amber-400" id="info-mesa-restante">R$ 0,00</span>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-2">
                <button onclick="iniciarPedidoMesaSelecionada()" class="tap-scale bg-amber-500 text-zinc-950 font-black py-3 rounded-xl text-xs flex justify-center items-center gap-1 shadow-sm">➕ Novo Pedido</button>
                <button onclick="abrirPagamentoParcial()" class="tap-scale bg-blue-600 text-white font-black py-3 rounded-xl text-xs flex justify-center items-center gap-1 shadow-sm">💸 Abater Valor</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICAÇÃO TOAST (25. Pedido Pronto) -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-5 py-3 rounded-full shadow-2xl font-bold text-xs flex items-center gap-2 z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <span class="text-lg">🛎️</span> <span id="toast-msg">Mensagem</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESTADOS GERAIS
        let abaAtiva = 'mesas';
        let cardapio = [];
        let carrinho = [];
        let mesaAtual = null;
        let todosPedidos = [];
        let mesasStatus = {}; // { 'Mesa 1': { status, total, pagoParcial, id, pedidoStr } }
        let numpadCallback = null;
        let pedidosAlertados = new Set();
        let pedidoInfoAtualId = null;

        // LISTA DE MESAS PADRÃO (Pode personalizar)
        const listaMesas = Array.from({length: 15}, (_, i) => `Mesa ${i+1}`).concat(['Balcão 1', 'Balcão 2', 'Balcão 3']);

        // 9. INDICADOR DE CONEXÃO
        function atualizarConexao() {
            const status = document.getElementById('status-conexao');
            const texto = document.getElementById('texto-conexao');
            if(navigator.onLine) {
                status.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                texto.innerText = "Online"; texto.className = "text-[10px] text-emerald-600 font-bold uppercase";
            } else {
                status.className = "w-2 h-2 rounded-full bg-red-500";
                texto.innerText = "Offline"; texto.className = "text-[10px] text-red-500 font-bold uppercase";
            }
        }
        window.addEventListener('online', atualizarConexao);
        window.addEventListener('offline', atualizarConexao);
        atualizarConexao();

        // NAVEGAÇÃO DE ABAS
        window.mudarAba = function(aba) {
            abaAtiva = aba;
            document.getElementById('aba-mesas').className = aba === 'mesas' ? "tap-scale flex-1 bg-amber-500 text-zinc-950 font-extrabold py-2.5 rounded-xl text-xs shadow transition" : "tap-scale flex-1 bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 font-extrabold py-2.5 rounded-xl text-xs transition";
            document.getElementById('aba-cardapio').className = aba === 'cardapio' ? "tap-scale flex-1 bg-amber-500 text-zinc-950 font-extrabold py-2.5 rounded-xl text-xs shadow transition" : "tap-scale flex-1 bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 font-extrabold py-2.5 rounded-xl text-xs transition";
            
            document.getElementById('view-mesas').classList.toggle('hidden', aba !== 'mesas');
            document.getElementById('view-cardapio').classList.toggle('hidden', aba !== 'cardapio');
        }

        // FIREBASE: OUVIR CARDÁPIO (24. Trava de Esgotado)
        onSnapshot(collection(db, "cardapio"), (snapshot) => {
            cardapio = [];
            snapshot.forEach(docSnap => cardapio.push({ id: docSnap.id, ...docSnap.data() }));
            renderizarCardapio();
        });

        // FIREBASE: OUVIR PEDIDOS (Cálculo de Tempo, Status das Mesas e Alertas)
        onSnapshot(collection(db, "pedidos"), (snapshot) => {
            todosPedidos = [];
            mesasStatus = {};
            let somaTempo = 0;
            let qtdPendentes = 0;
            let agora = Date.now();

            snapshot.forEach(docSnap => {
                let p = { id: docSnap.id, ...docSnap.data() };
                todosPedidos.push(p);

                // 25. ALERTA DE PEDIDO PRONTO
                if(p.status === 'Entregue' && !pedidosAlertados.has(p.id)) {
                    pedidosAlertados.add(p.id);
                    mostrarToast(`Pronto: ${p.mesa}!`);
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]); // Choquinho
                }

                // Calcula tempo médio (39)
                if(p.status === 'Pendente' && p.timestampCriacao) {
                    qtdPendentes++;
                    somaTempo += Math.floor((agora - p.timestampCriacao) / 60000); // Em minutos
                }

                // Mapear status das mesas
                if(p.status === 'Pendente' || p.status === 'Entregue') {
                    if(!mesasStatus[p.mesa]) mesasStatus[p.mesa] = { id: p.id, status: p.status, pedido: p.pedido, total: 0, pagoParcial: p.valorPagoParcial || 0 };
                    
                    // Prioriza cor vermelha (Pendente) sobre amarelo (Entregue)
                    if(p.status === 'Pendente') mesasStatus[p.mesa].status = 'Pendente';
                    
                    let val = parseFloat((p.total || "0").replace('R$', '').replace(/\s/g, '').replace('.','').replace(',','.'));
                    mesasStatus[p.mesa].total += (val || 0);
                    // Agrupa texto do pedido para a Info
                    mesasStatus[p.mesa].pedido += `<br>--<br>${p.pedido}`; 
                }
            });

            // Atualiza Tempo Médio (39)
            let media = qtdPendentes > 0 ? Math.floor(somaTempo / qtdPendentes) : 0;
            document.getElementById('tempo-medio').innerText = qtdPendentes > 0 ? `${media} min` : "Livre";

            renderizarMesas();
        });

        // 23. MAPA VISUAL DO SALÃO (GRID)
        function renderizarMesas() {
            const container = document.getElementById('view-mesas');
            container.innerHTML = '';

            listaMesas.forEach(mesa => {
                const ocupada = mesasStatus[mesa];
                let corBg = "bg-emerald-100 dark:bg-emerald-950/50";
                let corBorda = "border-emerald-300 dark:border-emerald-800";
                let corTexto = "text-emerald-700 dark:text-emerald-400";
                let icone = "🟢";

                if (ocupada) {
                    if (ocupada.status === 'Pendente') {
                        corBg = "bg-red-100 dark:bg-red-950/60"; corBorda = "border-red-400 dark:border-red-800"; corTexto = "text-red-700 dark:text-red-400"; icone = "👨‍🍳";
                    } else if (ocupada.status === 'Entregue') {
                        corBg = "bg-amber-100 dark:bg-amber-950/60"; corBorda = "border-amber-400 dark:border-amber-800"; corTexto = "text-amber-700 dark:text-amber-400"; icone = "🍽️";
                    }
                }

                let div = document.createElement('div');
                div.className = `tap-scale aspect-square flex flex-col justify-center items-center rounded-3xl border-2 ${corBg} ${corBorda} shadow-sm transition relative`;
                if(ocupada) div.setAttribute('onclick', `abrirMesaInfo('${mesa}')`);
                else div.setAttribute('onclick', `selecionarMesaNova('${mesa}')`);

                div.innerHTML = `
                    <span class="text-2xl mb-1">${icone}</span>
                    <span class="text-[11px] font-black uppercase text-center ${corTexto} leading-tight">${mesa}</span>
                    ${ocupada ? `<span class="absolute bottom-2 text-[9px] font-bold ${corTexto} bg-white/50 dark:bg-black/50 px-1.5 py-0.5 rounded-md">R$ ${(ocupada.total - ocupada.pagoParcial).toFixed(2).replace('.',',')}</span>` : ''}
                `;
                container.appendChild(div);
            });
        }

        window.selecionarMesaNova = function(nome) {
            mesaAtual = nome;
            document.getElementById('mesa-atual-badge').innerText = nome;
            mudarAba('cardapio');
            mostrarToast(`${nome} Selecionada`);
        }

        // INFORMAÇÕES DA MESA (Pagamento Parcial)
        window.abrirMesaInfo = function(mesa) {
            const info = mesasStatus[mesa];
            if(!info) return;
            pedidoInfoAtualId = info.id;
            mesaAtual = mesa;
            document.getElementById('mesa-atual-badge').innerText = mesa;

            document.getElementById('info-mesa-titulo').innerText = mesa;
            document.getElementById('info-mesa-status').innerText = info.status === 'Pendente' ? "👨‍🍳 Preparando" : "🍽️ Consumindo";
            document.getElementById('info-mesa-extrato').innerHTML = info.pedido;
            
            document.getElementById('info-mesa-total-orig').innerText = `R$ ${info.total.toFixed(2).replace('.',',')}`;
            document.getElementById('info-mesa-ja-pago').innerText = `- R$ ${info.pagoParcial.toFixed(2).replace('.',',')}`;
            document.getElementById('info-mesa-restante').innerText = `R$ ${(info.total - info.pagoParcial).toFixed(2).replace('.',',')}`;

            document.getElementById('modal-mesa-info').classList.remove('hidden');
        }
        window.fecharMesaInfo = function() { document.getElementById('modal-mesa-info').classList.add('hidden'); }
        window.iniciarPedidoMesaSelecionada = function() { fecharMesaInfo(); mudarAba('cardapio'); }

        // 34. PAGAMENTO PARCIAL
        window.abrirPagamentoParcial = async function() {
            let valorStr = prompt("Valor pago agora (Ex: 50.00):");
            if(!valorStr) return;
            let val = parseFloat(valorStr.replace(',','.'));
            if(isNaN(val) || val <= 0) return alert("Valor inválido!");
            
            try {
                let pRef = doc(db, "pedidos", pedidoInfoAtualId);
                let pSnap = await getDoc(pRef);
                let pData = pSnap.data();
                let atualPago = pData.valorPagoParcial || 0;
                await updateDoc(pRef, { valorPagoParcial: atualPago + val });
                mostrarToast(`R$ ${val.toFixed(2)} abatido!`);
                fecharMesaInfo();
            } catch(e) { alert("Erro ao abater."); }
        }

        // RENDERIZAR CARDÁPIO COM TRAVA (24)
        function renderizarCardapio() {
            const lista = document.getElementById('lista-cardapio');
            lista.innerHTML = '';
            
            // Agrupar por categoria
            let categorias = {};
            cardapio.forEach(item => {
                if(!categorias[item.categoria]) categorias[item.categoria] = [];
                categorias[item.categoria].push(item);
            });

            for(let cat in categorias) {
                let divCat = document.createElement('div');
                divCat.innerHTML = `<h3 class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-2 mt-4 ml-1">${cat}</h3>`;
                
                categorias[cat].forEach(item => {
                    let divItem = document.createElement('div');
                    
                    if(item.ativo === false) { // 24. Bloqueio de Esgotado
                        divItem.className = "bg-zinc-200 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 rounded-2xl p-3 flex justify-between items-center mb-2 opacity-60 grayscale";
                        divItem.innerHTML = `
                            <div><p class="font-bold text-zinc-600 line-through">${item.nome}</p><span class="bg-red-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded-md">ESGOTADO</span></div>
                            <span class="text-zinc-400 font-black">R$ ${item.preco.toFixed(2).replace('.',',')}</span>
                        `;
                    } else {
                        divItem.className = "bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-3 flex justify-between items-center mb-2 shadow-sm relative overflow-hidden";
                        divItem.innerHTML = `
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-amber-500"></div>
                            <div class="pl-2"><p class="font-bold text-zinc-800 dark:text-zinc-200">${item.nome}</p><p class="text-xs font-black text-amber-600 dark:text-amber-400">R$ ${item.preco.toFixed(2).replace('.',',')}</p></div>
                            <button onclick="adicionarCarrinho('${item.id}', '${item.nome}', ${item.preco})" class="tap-scale bg-amber-500 text-zinc-950 w-10 h-10 rounded-xl font-black text-xl flex justify-center items-center shadow-md">+</button>
                        `;
                    }
                    divCat.appendChild(divItem);
                });
                lista.appendChild(divCat);
            }
        }

        // FUNÇÕES DO CARRINHO
        window.adicionarCarrinho = function(id, nome, preco) {
            if(!mesaAtual) return alert("Selecione uma mesa primeiro na aba Salão!");
            let index = carrinho.findIndex(i => i.id === id);
            if(index > -1) carrinho[index].qtd++;
            else carrinho.push({ id, nome, preco, qtd: 1 });
            
            if(navigator.vibrate) navigator.vibrate(50); // Choquinho suave
            atualizarCarrinhoFlutuante();
        }

        function atualizarCarrinhoFlutuante() {
            const btn = document.getElementById('btn-carrinho-flutuante');
            if(carrinho.length === 0) { btn.classList.add('hidden'); return; }
            btn.classList.remove('hidden');
            
            let total = 0; let qtdItens = 0;
            carrinho.forEach(i => { total += (i.preco * i.qtd); qtdItens += i.qtd; });
            
            document.getElementById('carrinho-badge').innerText = `${qtdItens} itens`;
            document.getElementById('carrinho-total-flutuante').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
        }

        window.abrirCarrinho = function() {
            renderizarCarrinhoModal();
            document.getElementById('modal-carrinho').classList.remove('hidden');
        }
        window.fecharCarrinho = function() { document.getElementById('modal-carrinho').classList.add('hidden'); }
        
        // 17. RENDERIZAR CARRINHO (SWIPE TO DELETE COM CSS NATIVO)
        function renderizarCarrinhoModal() {
            const lista = document.getElementById('lista-carrinho');
            lista.innerHTML = '';
            let total = 0;

            carrinho.forEach((item, index) => {
                total += (item.preco * item.qtd);
                let div = document.createElement('div');
                // Container com Scroll Snap para o Swipe!
                div.className = "swipe-item-container flex overflow-x-auto scrollbar-hide w-full mb-2 bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800";
                
                div.innerHTML = `
                    <!-- Visão Frontal (Ocupa 100% da largura) -->
                    <div class="swipe-snap-center shrink-0 w-full flex justify-between items-center p-3 relative bg-white dark:bg-zinc-900">
                        <div class="flex items-center gap-3">
                            <button onclick="abrirNumpad(${index})" class="tap-scale bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200 font-black text-sm px-3 py-2 rounded-xl shadow-inner border border-zinc-200 dark:border-zinc-700">
                                ${item.qtd}x
                            </button>
                            <div>
                                <p class="font-bold text-xs text-zinc-800 dark:text-zinc-200 leading-tight">${item.nome}</p>
                                <p class="text-[10px] font-black text-amber-600 dark:text-amber-500">R$ ${(item.preco * item.qtd).toFixed(2).replace('.',',')}</p>
                            </div>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-bold tracking-widest uppercase ml-2 select-none animate-pulse">👈 Deslize</span>
                    </div>
                    
                    <!-- Botão de Excluir Escondido (Revelado no Swipe) -->
                    <div class="swipe-snap-center shrink-0 w-24 bg-red-500 text-white flex justify-center items-center font-black tap-scale rounded-r-2xl" onclick="removerItemCarrinho(${index})">
                        <span class="text-2xl">🗑️</span>
                    </div>
                `;
                lista.appendChild(div);
            });

            document.getElementById('carrinho-total-final').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
            if(carrinho.length === 0) fecharCarrinho();
        }

        window.removerItemCarrinho = function(index) {
            carrinho.splice(index, 1);
            if(navigator.vibrate) navigator.vibrate(100);
            renderizarCarrinhoModal();
            atualizarCarrinhoFlutuante();
        }

        window.limparCarrinho = function() {
            if(confirm("Esvaziar carrinho?")) { carrinho = []; atualizarCarrinhoFlutuante(); fecharCarrinho(); }
        }

        // 31. TECLADO NUMÉRICO GIGANTE
        window.abrirNumpad = function(index) {
            numpadCallback = index;
            document.getElementById('numpad-display').innerText = "";
            document.getElementById('modal-numpad').classList.remove('hidden');
        }
        window.fecharNumpad = function() { document.getElementById('modal-numpad').classList.add('hidden'); }
        window.numPress = function(num) {
            let display = document.getElementById('numpad-display');
            if(display.innerText.length < 3) display.innerText += num;
        }
        window.confirmarNumpad = function() {
            let val = parseInt(document.getElementById('numpad-display').innerText);
            if(val > 0 && numpadCallback !== null) {
                carrinho[numpadCallback].qtd = val;
                if(navigator.vibrate) navigator.vibrate(50);
                renderizarCarrinhoModal();
                atualizarCarrinhoFlutuante();
            }
            fecharNumpad();
        }

        // 8. CALCULADORA DE RACHA
        window.abrirRacha = function() {
            let total = carrinho.reduce((acc, item) => acc + (item.preco * item.qtd), 0);
            let pessoasStr = prompt("Dividir a conta para quantas pessoas?");
            if(!pessoasStr) return;
            let pessoas = parseInt(pessoasStr);
            if(pessoas > 0) {
                let calc = (total / pessoas).toFixed(2).replace('.',',');
                alert(`Total: R$ ${total.toFixed(2).replace('.',',')}\n\nFica R$ ${calc} para cada um (${pessoas} pessoas)`);
            }
        }

        // ENVIAR PEDIDO
        window.enviarPedido = async function() {
            if(carrinho.length === 0) return;
            
            let txtObs = document.getElementById('obs-pedido').value.trim();
            let totalVal = carrinho.reduce((acc, item) => acc + (item.preco * item.qtd), 0);
            
            let strItens = carrinho.map(i => `${i.qtd}x ${i.nome}`).join('\n');
            if(txtObs) strItens += `\nObs: ${txtObs}`;

            let objPedido = {
                mesa: mesaAtual,
                itensBrutos: carrinho,
                pedido: strItens,
                total: `R$ ${totalVal.toFixed(2).replace('.',',')}`,
                status: 'Pendente',
                timestampCriacao: Date.now(),
                dataCriacao: new Date().toISOString().split('T')[0],
                horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                pagoNaHora: false,
                atendente: "Garçom App",
                valorPagoParcial: 0
            };

            try {
                document.getElementById('modal-carrinho').classList.add('hidden');
                mostrarToast("Enviando...");
                await addDoc(collection(db, "pedidos"), objPedido);
                carrinho = [];
                atualizarCarrinhoFlutuante();
                document.getElementById('obs-pedido').value = '';
                mostrarToast("✅ Pedido na Cozinha!");
                mudarAba('mesas');
            } catch(e) {
                alert("Erro ao enviar. Verifique a internet.");
            }
        }

        // TOAST NOTIFICATION
        window.mostrarToast = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-20px]'); }, 3000);
        }

    </script>
</body>
</html>
