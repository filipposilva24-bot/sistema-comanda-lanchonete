<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda - Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-12">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg p-4 flex flex-col justify-between">
        <div>
            <header class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-orange-600">Nova Comanda</h1>
                <p class="text-sm text-gray-500">Selecione os itens e informe a mesa</p>
            </header>
            
            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-bold mb-2">Local / Mesa:</label>
                <input type="text" id="mesa" placeholder="Ex: Mesa 05 ou Balcão" class="w-full px-3 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-lg font-medium bg-gray-50">
            </div>

            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-bold mb-2">Adicionar Itens:</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="adicionarItem('X-Salada')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-semibold hover:bg-orange-100 transition text-left">🍔 X-Salada</button>
                    <button onclick="adicionarItem('X-Bacon')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-semibold hover:bg-orange-100 transition text-left">🥓 X-Bacon</button>
                    <button onclick="adicionarItem('X-Tudo')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-semibold hover:bg-orange-100 transition text-left">👑 X-Tudo</button>
                    <button onclick="adicionarItem('Batata Frita')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-semibold hover:bg-orange-100 transition text-left">🍟 Batata Frita</button>
                    <button onclick="adicionarItem('Coca-Cola')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-semibold hover:bg-orange-100 transition text-left">🥤 Coca-Cola</button>
                    <button onclick="adicionarItem('Guaraná')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-semibold hover:bg-orange-100 transition text-left">🥤 Guaraná</button>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-bold mb-2">Itens do Pedido:</label>
                <div id="resumo-pedido" class="bg-gray-50 border rounded-xl p-3 min-h-[100px] max-h-[180px] overflow-y-auto mb-3">
                    <p class="text-gray-400 text-center italic text-sm mt-4" id="vazio-texto">Nenhum item adicionado ainda.</p>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Observações (opcional):</label>
                <input type="text" id="obs" placeholder="Ex: Sem cebola, caprichar no molho..." class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
            </div>
        </div>

        <div>
            <button onclick="enviarPedido()" class="w-full bg-orange-600 text-white font-bold py-4 px-4 rounded-xl hover:bg-orange-700 transition shadow-lg text-lg">
                🚀 Enviar para Cozinha
            </button>
            <p id="status" class="text-center text-sm mt-3 text-green-600 font-semibold h-5"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let itensCarrinho = [];

        window.adicionarItem = function(nomeItem) {
            const encontrado = itensCarrinho.find(i => i.nome === nomeItem);
            if (encontrado) {
                encontrado.qtd++;
            } else {
                itensCarrinho.push({ nome: nomeItem, qtd: 1 });
            }
            atualizarResumo();
        }

        window.removerItem = function(nomeItem) {
            const index = itensCarrinho.findIndex(i => i.nome === nomeItem);
            if (index !== -1) {
                itensCarrinho[index].qtd--;
                if (itensCarrinho[index].qtd <= 0) {
                    itensCarrinho.splice(index, 1);
                }
            }
            atualizarResumo();
        }

        function atualizarResumo() {
            const container = document.getElementById('resumo-pedido');
            const vazioTexto = document.getElementById('vazio-texto');
            
            container.innerHTML = '';
            
            if (itensCarrinho.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center italic text-sm mt-4" id="vazio-texto">Nenhum item adicionado ainda.</p>';
                return;
            }

            itensCarrinho.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center py-2 border-b border-gray-200 last:border-0";
                div.innerHTML = `
                    <span class="font-medium text-gray-800">${item.qtd}x ${item.nome}</span>
                    <div class="space-x-2">
                        <button onclick="removerItem('${item.nome}')" class="bg-red-100 text-red-600 px-2 py-1 rounded-lg font-bold text-sm">-</button>
                        <button onclick="adicionarItem('${item.nome}')" class="bg-green-100 text-green-600 px-2 py-1 rounded-lg font-bold text-sm">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.enviarPedido = async function() {
            const mesa = document.getElementById('mesa').value.trim();
            const obs = document.getElementById('obs').value.trim();
            const status = document.getElementById('status');

            if (!mesa) {
                alert('Por favor, informe a Mesa ou o Local!');
                return;
            }

            if (itensCarrinho.length === 0) {
                alert('Adicione pelo menos um item ao pedido!');
                return;
            }

            // Monta o texto final do pedido
            let textoPedidoFormatado = itensCarrinho.map(i => `${i.qtd}x ${i.nome}`).join('\n');
            if (obs) {
                textoPedidoFormatado += `\nObs: ${obs}`;
            }

            try {
                await addDoc(collection(db, "pedidos"), {
                    mesa: mesa,
                    pedido: textoPedidoFormatado,
                    status: "Pendente",
                    horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                });

                // Limpa o formulário
                document.getElementById('mesa').value = '';
                document.getElementById('obs').value = '';
                itensCarrinho = [];
                atualizarResumo();

                status.innerText = "Pedido enviado com sucesso!";
                setTimeout(() => status.innerText = "", 3000);
            } catch (e) {
                console.error("Erro ao enviar pedido: ", e);
                alert("Erro ao enviar pedido.");
            }
        }
    </script>
</body>
</html>
