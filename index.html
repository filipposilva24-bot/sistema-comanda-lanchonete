<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda - Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h1 class="text-2xl font-bold text-center text-orange-600 mb-6">Novo Pedido</h1>
        
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Tipo / Número:</label>
            <input type="text" id="mesa" placeholder="Ex: Mesa 05 ou Balcão" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Descrição do Pedido:</label>
            <textarea id="pedido" rows="4" placeholder="Ex: 1x X-Tudo (sem cebola), 2x Coca-Cola" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
        </div>

        <button onclick="enviarPedido()" class="w-full bg-orange-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-orange-700 transition duration-200">
            Enviar para Cozinha
        </button>
        
        <p id="status" class="text-center text-sm mt-4 text-green-600 font-semibold"></p>
    </div>

    <!-- Script do Firebase e lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.enviarPedido = async function() {
            const mesa = document.getElementById('mesa').value;
            const pedido = document.getElementById('pedido').value;
            const status = document.getElementById('status');

            if (!mesa || !pedido) {
                alert('Preencha o local/mesa e o pedido!');
                return;
            }

            try {
                await addDoc(collection(db, "pedidos"), {
                    mesa: mesa,
                    pedido: pedido,
                    status: "Pendente",
                    horario: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                });

                document.getElementById('mesa').value = '';
                document.getElementById('pedido').value = '';
                status.innerText = "Pedido enviado com sucesso!";
                setTimeout(() => status.innerText = "", 3000);
            } catch (e) {
                console.error("Erro ao enviar pedido: ", e);
                alert("Erro ao enviar pedido.");
            }
        }
    </script>
</body>
</html>
